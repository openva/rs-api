openapi: 3.0.3
info:
  title: Richmond Sunlight API
  description: |
    API for accessing legislative data including bills, legislators, and votes.
    Supports both v1.0 and v1.1 endpoints.
  version: 1.1

servers:
  - url: https://api.richmondsunlight.com/1.1
    description: Production server (1.1)
  - url: https://api.richmondsunlight.com/1.0
    description: Production server (1.0)

paths:
  /tag-suggest:
    get:
      tags: [Tags]
      summary: Get tag suggestions
      description: Available in v1.1 only
      parameters:
        - name: term
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["crime", "firearm", "weapon"]
        '400':
          description: Invalid term
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /bysection/{section}.json:
    get:
      tags: [Code]
      summary: Get code section
      parameters:
        - name: section
          in: path
          required: true
          description: Virginia Code section number (URL encoded)
          schema:
            type: string
            example: "18.2-174"
      responses:
        '200':
          description: Bills found for section
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    year:
                      type: string
                    number:
                      type: string
                    catch_line:
                      type: string
                    summary:
                      type: string
                    outcome:
                      type: string
                    chamber:
                      type: string
                      enum: [house, senate]
                    legislator:
                      type: string
        '400':
          description: Invalid section format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /section-video/{section}.json:
    get:
      tags: [Code]
      summary: Get video clips by code section
      description: |
        Returns video clips from legislative sessions discussing a specific code section.
        Available in v1.1 only.
      parameters:
        - name: section
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Video clips found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bill_number:
                      type: string
                    year:
                      type: string
                    date:
                      type: string
                      format: date
                    chamber:
                      type: string
                      enum: [house, senate]
                    time_start:
                      type: string
                    time_end:
                      type: string
                    screenshot:
                      type: string
                      format: uri
                    video_url:
                      type: string
                      format: uri
        '400':
          description: Invalid section format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /bills/{year}.json:
    get:
      tags: [Bills]
      summary: List bills for year
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}$'
      responses:
        '200':
          description: Bills found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    number:
                      type: string
                    chamber:
                      type: string
                      enum: [house, senate]
                    date_introduced:
                      type: string
                      format: date
                    status:
                      type: string
                    outcome:
                      type: string
                    title:
                      type: string
                    patron:
                      type: object
                      properties:
                        name:
                          type: string
                        id:
                          type: string
        '400':
          description: Invalid year
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /bill/{year}/{billId}.json:
    get:
      tags: [Bills]
      summary: Get bill details
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}$'
        - name: billId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9]+$'
      responses:
        '200':
          description: Bill found
          content:
            application/json:
              schema:
                type: object
                properties:
                  number:
                    type: string
                  catch_line:
                    type: string
                  summary:
                    type: string
                  status:
                    type: string
                  outcome:
                    type: string
                  patron:
                    type: object
                    properties:
                      name:
                        type: string
                      id:
                        type: string
                  video:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          format: uri
                        screenshot:
                          type: string
                          format: uri
                        time_start:
                          type: string
                        time_end:
                          type: string
        '400':
          description: Invalid bill parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /legislators.json:
    get:
      tags: [Legislators]
      summary: List all legislators
      description: Available in v1.1 only
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9]{4}$'
      responses:
        '200':
          description: List of legislators found
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    chamber:
                      type: string
                      enum: [house, senate]
                    party:
                      type: string
                    district:
                      type: string
        '400':
          description: Invalid year
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /legislator/{shortname}.json:
    get:
      tags: [Legislators]
      summary: Get legislator details
      parameters:
        - name: shortname
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z-]+$'
      responses:
        '200':
          description: Legislator found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  chamber:
                    type: string
                    enum: [house, senate]
                  party:
                    type: string
                  district:
                    type: string
                  sbe_id:
                    type: string
                  bills:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /video/{slug}.json:
    get:
      tags: [Videos]
      summary: Get a single video
      description: >
        Returns everything about a single video, by its slug: the meeting it records, where to play
        it, a guide to it (the bills taken up and the legislators who spoke, as identified by the
        broadcast's chyrons), its transcript, and the day's minutes and other videos. A video that
        hasn't been downloaded yet has the status "processing", and nothing to play.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[bcdfghjkmnpqrstvwxz2-9]{4}$'
          description: The video's slug, four characters (e.g., k7qm), always including a letter
      responses:
        '200':
          description: Video found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/VideoSummary'
                  - type: object
                    properties:
                      pending:
                        type: array
                        description: Parts of the video's guide that are still being prepared
                        items:
                          type: string
                          enum: [transcript, bills, speakers]
                      description:
                        type: string
                      width:
                        type: integer
                        nullable: true
                      height:
                        type: integer
                        nullable: true
                      license:
                        type: string
                      sponsor:
                        type: string
                        nullable: true
                        description: Who paid for the video. May contain HTML (a link and a logo).
                      media:
                        type: object
                        properties:
                          mp4:
                            type: string
                            format: uri
                            nullable: true
                          youtube_id:
                            type: string
                            nullable: true
                          poster:
                            type: string
                            format: uri
                            nullable: true
                      bills:
                        type: array
                        items:
                          type: object
                          properties:
                            start:
                              type: number
                              description: Seconds from the start of the video
                            end:
                              type: number
                            number:
                              type: string
                            year:
                              type: integer
                              nullable: true
                            catch_line:
                              type: string
                              nullable: true
                            url:
                              type: string
                              format: uri
                              nullable: true
                      speakers:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            shortname:
                              type: string
                            label:
                              type: string
                              description: The legislator's name as of the video's date (e.g., "Del. Jessica Anderson (D-Williamsburg)")
                            starts:
                              type: array
                              description: When the legislator was identified as speaking, in seconds
                              items:
                                type: number
                      transcript:
                        type: array
                        description: The transcript, in turns, one per speaker (or per minute, when the speaker is unknown)
                        items:
                          type: object
                          properties:
                            start:
                              type: number
                            speaker:
                              type: object
                              nullable: true
                              properties:
                                name:
                                  type: string
                                shortname:
                                  type: string
                            lines:
                              type: array
                              items:
                                type: object
                                properties:
                                  start:
                                    type: number
                                  end:
                                    type: number
                                  text:
                                    type: string
                      captions:
                        type: string
                        format: uri
                        nullable: true
                        description: The transcript as WebVTT captions (/video/{slug}.vtt)
                      minutes:
                        type: string
                        format: uri
                        nullable: true
                        description: The chamber's minutes for the video's date, on Richmond Sunlight
                      same_day:
                        type: array
                        items:
                          type: object
                          properties:
                            slug:
                              type: string
                            url:
                              type: string
                              format: uri
                            chamber:
                              type: string
                              enum: [house, senate]
                            label:
                              type: string
                            status:
                              type: string
                              enum: [available, processing]
        '404':
          $ref: '#/components/responses/NotFound'

  /video/{slug}.vtt:
    get:
      tags: [Videos]
      summary: Get a video's captions
      description: Returns a video's transcript as WebVTT captions, timed to the video.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[bcdfghjkmnpqrstvwxz2-9]{4}$'
      responses:
        '200':
          description: Captions found
          content:
            text/vtt:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /video/{id}.json:
    get:
      tags: [Videos]
      deprecated: true
      summary: Get a single video, by its numeric ID
      description: >
        Deprecated: video IDs may change. Use /video/{slug}.json, which has much more about each
        video. This includes each video's slug, to find it there.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Numeric video ID
      responses:
        '200':
          description: Video found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  date:
                    type: string
                    format: date
                  chamber:
                    type: string
                    enum: [house, senate]
                  committee:
                    type: string
                    nullable: true
                  title:
                    type: string
                  path:
                    type: string
                    format: uri
                  description:
                    type: string
                  width:
                    type: string
                  height:
                    type: string
                  sponsor:
                    type: string
                    nullable: true
                  has_transcript:
                    type: boolean
                  is_indexed:
                    type: boolean
                  slug:
                    type: string
                  url:
                    type: string
                    format: uri
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /videos.json:
    get:
      tags: [Videos]
      summary: List videos
      description: >
        Returns a list of videos, oldest first, optionally filtered by year, date, chamber, and
        committee. With no filters, it lists every video. Filters that match no videos return an
        empty list.
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}$'
          description: Filter videos to a specific 4-digit year
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter videos to a single date (YYYY-MM-DD)
        - name: chamber
          in: query
          required: false
          schema:
            type: string
            enum: [house, senate]
        - name: committee
          in: query
          required: false
          schema:
            type: string
          description: A committee's shortname (e.g., appropriations). Includes its subcommittees. Requires chamber.
      responses:
        '200':
          description: Videos found
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/VideoSummary'
                    - type: object
                      properties:
                        id:
                          type: string
                        date:
                          type: string
                          format: date
                        chamber:
                          type: string
                          enum: [house, senate]
                        committee:
                          type: string
                          nullable: true
                        title:
                          type: string
                        path:
                          type: string
                          format: uri
                        description:
                          type: string
                        width:
                          type: string
                        height:
                          type: string
                        sponsor:
                          type: string
                          nullable: true
                        has_transcript:
                          type: boolean
                        is_indexed:
                          type: boolean
                        poster:
                          type: string
                          format: uri
                          nullable: true
        '400':
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /vote/{year}/{lisId}.json:
    get:
      tags: [Votes]
      summary: Get vote details
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}$'
        - name: lisId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{1,6}$'
      responses:
        '200':
          description: Vote found
          content:
            application/json:
              schema:
                type: object
                properties:
                  chamber:
                    type: string
                    enum: [house, senate]
                  outcome:
                    type: string
                  tally:
                    type: string
                  legislators:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        shortname:
                          type: string
                        vote:
                          type: string
                        party:
                          type: string
                          enum: [D, R, I]
                        chamber:
                          type: string
                          enum: [house, senate]
                        district:
                          type: string
                        address:
                          type: string
                        started:
                          type: string
                          description: Four-digit year the legislator started service
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    VideoMeetingCommittee:
      type: object
      nullable: true
      properties:
        name:
          type: string
        shortname:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          nullable: true
          description: The committee's page on Richmond Sunlight, if it has one
    VideoSummary:
      type: object
      properties:
        slug:
          type: string
          description: The video's permanent ID, four characters (e.g., k7qm)
        url:
          type: string
          format: uri
          description: The video's page on Richmond Sunlight
        status:
          type: string
          enum: [available, processing]
          description: Whether there's anything to play yet
        date:
          type: string
          format: date
        chamber:
          type: string
          enum: [house, senate]
        meeting:
          type: object
          properties:
            type:
              type: string
              enum: [floor, committee, subcommittee, unknown]
              description: '"unknown" is a committee meeting whose committee hasn''t been identified'
            label:
              type: string
              description: e.g., "House floor session" or "House Appropriations Committee"
            committee:
              $ref: '#/components/schemas/VideoMeetingCommittee'
            parent_committee:
              $ref: '#/components/schemas/VideoMeetingCommittee'
        title:
          type: string
        length:
          type: integer
          nullable: true
          description: In seconds
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
              example: "Invalid parameter"
            details:
              type: string
              example: "Parameter year must be a 4-digit year."
    BillSummary:
      type: object
      properties:
        number:
          type: string
        title:
          type: string
        status:
          type: string
        outcome:
          type: string
        url:
          type: string
          format: uri
    Error404:
      type: object
      properties:
        error:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              example: "Not found"
            details:
              type: string
              example: "The requested resource could not be found"
    Error:
      type: object
      properties:
        error:
          type: string
          example: "Not found"
  responses:
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: Bills
    description: Operations about bills
  - name: Legislators
    description: Operations about legislators
  - name: Code
    description: Operations about code sections
  - name: Tags
    description: Operations about tags
  - name: Videos
    description: Operations about videos
